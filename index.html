<!doctype html>
<meta charset="utf-8">
<title>Bedrock Add-on Builder</title>
<style>
  :root {
    box-sizing: border-box;
  }
  *, *::before, *::after {
    box-sizing: inherit;
  }
  :root {
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
    --bg: #f8fafc;
    --text: #0f172a;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --muted: #94a3b8;
    --hint: #475569;
    --editor-bg: #0f172a;
    --editor-text: #e2e8f0;
    --status-bg: #0f172a;
    --status-text: #94a3b8;
    --primary: #2563eb;
    --secondary-bg: #e2e8f0;
    --secondary-text: #0f172a;
    --danger: #dc2626;
    --ghost-bg: rgba(148,163,184,0.18);
    --ghost-text: #0f172a;
  }
  body.theme-dark {
    --bg: #05060b;
    --text: #f8fafc;
    --card-bg: #0f172a;
    --border: #1f2937;
    --muted: #cbd5f5;
    --hint: #cbd5f5;
    --editor-bg: #020617;
    --editor-text: #e2e8f0;
    --status-bg: #020617;
    --status-text: #cbd5f5;
    --primary: #38bdf8;
    --secondary-bg: #1e293b;
    --secondary-text: #f8fafc;
    --danger: #f87171;
    --ghost-bg: rgba(148,163,184,0.35);
    --ghost-text: #f8fafc;
  }
  body {
    margin: 0;
    color: var(--text);
    background: var(--bg);
    transition: background .3s ease, color .3s ease;
    display: flex;
    min-height: 100vh;
  }
  aside {
    width: 260px;
    background: var(--card-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 1.5rem;
    flex-shrink: 0;
  }
  main {
    flex-grow: 1;
    max-width: 960px;
    margin: 2rem auto;
    background: var(--card-bg);
    border-radius: 16px;
    padding: 2rem;
    box-shadow: 0 18px 35px rgba(15,23,42,.08);
    height: fit-content;
  }
  .mob-list {
    list-style: none;
    padding: 0;
    margin: 1.5rem 0;
    flex-grow: 1;
    overflow-y: auto;
  }
  .mob-item {
    padding: 0.75rem 1rem;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    background: var(--bg);
    border: 1px solid transparent;
    transition: all 0.2s;
    gap: 0.75rem;
  }
  .mob-item:hover {
    border-color: var(--primary);
  }
  .mob-item.active {
    background: var(--ghost-bg);
    border-color: var(--primary);
  }
  .mob-item .mob-name {
    flex-grow: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mob-item input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
  }
  .mob-item .delete-btn {
    opacity: 0;
    background: none;
    color: var(--danger);
    padding: 0.25rem;
    font-size: 0.8rem;
    border-radius: 4px;
  }
  .mob-item:hover .delete-btn {
    opacity: 0.7;
  }
  .mob-item .delete-btn:hover {
    opacity: 1;
    background: rgba(220, 38, 38, 0.1);
  }
  .sidebar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
  }
  .sidebar-header h2 {
    margin: 0;
    font-size: 1.25rem;
  }
  .sidebar-footer {
    border-top: 1px solid var(--border);
    padding-top: 1.5rem;
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .sidebar-footer label {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 0.25rem;
  }
  h1 { margin-top: 0; }
  textarea {
    width:100%;
    min-height: 380px;
    font: 14px/1.4 ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;
    padding: 1rem;
    border-radius: 12px;
    border:1px solid var(--border);
    background: var(--editor-bg);
    color: var(--editor-text);
  }
  textarea:focus { outline: 2px solid var(--primary); }
  .actions { display:flex; gap: 1rem; margin-top: 1rem; flex-wrap: wrap; }
  button { padding: .75rem 1.4rem; border-radius: 999px; border: none; font-weight: 600; cursor: pointer; transition: transform .2s ease; }
  button:active { transform: scale(0.97); }
  button.primary { background: var(--primary); color:#fff; }
  button.secondary { background: var(--secondary-bg); color: var(--secondary-text); }
  button.danger { background: var(--danger); color:#fff; }
  button.ghost { background: var(--ghost-bg); color: var(--ghost-text); }
  label { font-weight: 600; display:block; margin-bottom: .35rem; }
  input[type=file] { width:100%; padding:.35rem 0; color: var(--text); }
  input[type=password], select {
    width: 100%;
    padding: .6rem .75rem;
    border-radius: 10px;
    border:1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font: inherit;
  }
  .row { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-top: 1rem; }
  .llm-card { margin-top: 1.5rem; padding: 1.2rem 1.4rem; border-radius: 16px; border:1px solid var(--border); background: rgba(148,163,184,0.12); display:flex; flex-direction:column; gap:1rem; }
  .llm-controls { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:1rem; align-items:end; }
  .llm-controls .field { min-width:0; }
  .llm-controls .field label { font-size:.9rem; color: var(--hint); margin-bottom:.35rem; }
  .llm-card select,
  .llm-card input[type=password] {
    height: 46px;
    border-radius: 12px;
    border:1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    padding: 0 .9rem;
    font: inherit;
  }
  /* Texture Painter Styles */
  .painter-container {
    margin-top: 2rem;
    padding: 1.5rem;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
  }
  .painter-layout {
    display: flex;
    gap: 2rem;
    flex-wrap: wrap;
  }
  .painter-canvas-wrapper {
    background: #ccc;
    background-image: linear-gradient(45deg, #eee 25%, transparent 25%, transparent 75%, #eee 75%, #eee), linear-gradient(45deg, #eee 25%, #fff 25%, #fff 75%, #eee 75%, #eee);
    background-size: 20px 20px;
    background-position: 0 0, 10px 10px;
    border: 2px solid var(--border);
    line-height: 0;
    cursor: crosshair;
    image-rendering: pixelated;
  }
  canvas#pixel-canvas {
    image-rendering: pixelated;
    display: block;
  }
  .painter-tools {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    min-width: 200px;
  }
  .color-swatch {
    width: 32px;
    height: 32px;
    border-radius: 4px;
    border: 1px solid var(--border);
    cursor: pointer;
  }
  .color-swatch.active {
    outline: 2px solid var(--primary);
  }
  .tool-row {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  #llm-prompt {
    min-height: 140px;
    background: var(--card-bg);
    color: var(--text);
    border-radius: 12px;
    border:1px solid var(--border);
    resize: vertical;
  }
  .llm-footnote { color: var(--hint); font-size:.85rem; }
  #status {
    background: var(--status-bg);
    color: var(--status-text);
    padding: 1rem;
    border-radius: 12px;
    margin-top:1rem;
    min-height:3rem;
    white-space:pre-wrap;
  }
  .hint { color: var(--hint); font-size:.95rem; margin-bottom:1rem; }
  .build-options { margin-top:1.25rem; display:flex; align-items:center; gap:1rem; flex-wrap:wrap; }
  .build-options label { margin:0; font-size:.95rem; }
  .build-options select { width:auto; min-width:220px; }
  details { margin-top:1rem; }
  code { font-family: ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; }
  .toolbar { display:flex; justify-content:flex-end; margin-bottom:1rem; }
</style>
<aside>
  <div class="sidebar-header">
    <h2>Mobs</h2>
    <button type="button" class="primary" id="add-mob" style="padding: 0.5rem 0.75rem; font-size: 0.9rem;">+ New</button>
  </div>
  <ul class="mob-list" id="mob-list">
    <!-- Mobs will be listed here -->
  </ul>
  <div class="sidebar-footer">
    <div>
      <label for="build-mode">Download Type</label>
      <select id="build-mode" style="width: 100%;">
        <option value="bundle">Bundle (.zip with mcaddon)</option>
        <option value="mcworld">World (.mcworld)</option>
      </select>
    </div>
    <button type="button" class="primary" id="build-bundle" style="width: 100%;">Build Bundle</button>
    <div id="sidebar-status" style="font-size: 0.85rem; padding: 0.5rem; border-radius: 8px; background: var(--bg); display: none; margin-top: 0.5rem; word-break: break-all;"></div>
    <button type="button" class="ghost" id="theme-toggle" style="width: 100%;">🌙 Dark Mode</button>
  </div>
</aside>
<main>
  <h1>Bedrock Add-on Builder</h1>
  <p class="hint">
    Edit JSON specs individually. Select mobs in the sidebar to include them in the final bundle.
  </p>
  <div class="row">
    <div>
      <label>Resource Pack (.zip/.mcpack)</label>
      <input type="file" id="resource">
    </div>
    <div>
      <label>Behavior Pack (.zip/.mcpack)</label>
      <input type="file" id="behavior">
    </div>
  </div>
  <div class="llm-card">
    <div>
      <label style="font-size:1rem;">LLM Assistant Prompt</label>
      <p class="hint" style="margin:.2rem 0 0;">Describe the change you want and let an LLM update the spec.</p>
    </div>
    <div class="llm-controls">
      <div class="field">
        <label>Provider</label>
        <select id="llm-provider">
          <option value="openai">OpenAI</option>
          <option value="deepseek">DeepSeek</option>
        </select>
      </div>
      <div class="field">
        <label>API Key</label>
        <input type="password" id="llm-key" placeholder="sk-..." autocomplete="off">
      </div>
    </div>
    <textarea id="llm-prompt" placeholder="Describe how the mob should change (damage, hp, colors, geometry...)."></textarea>
    <div class="actions">
      <button type="button" class="primary" id="llm-run">Ask LLM</button>
    </div>
  </div>
  <pre id="status">Loading spec...</pre>
  <label style="margin-top:1rem;">Mob Spec JSON</label>
  <textarea id="spec-editor" spellcheck="false" autocomplete="off"></textarea>
  <div class="actions">
    <button type="button" class="secondary" id="reset">Reset</button>
    <button type="button" class="danger" id="save">Save Spec</button>
  </div>
  <div class="painter-container">
    <h2 style="margin-top: 0;">Texture Painter</h2>
    <p class="hint">Paint the 64x64 skin for the selected mob.</p>
    <div class="painter-layout">
      <div class="painter-canvas-wrapper">
        <canvas id="pixel-canvas" width="384" height="384"></canvas>
      </div>
      <div class="painter-tools">
        <div class="field">
          <label>Color</label>
          <input type="color" id="painter-color" value="#ff0000" style="width: 100%; height: 46px; padding: 0; border: none; border-radius: 8px;">
        </div>
        <div class="tool-row">
          <button type="button" class="secondary" id="painter-pencil">✏️ Pencil</button>
          <button type="button" class="secondary" id="painter-eraser">🧽 Eraser</button>
          <button type="button" class="secondary" id="painter-clear">🗑 Clear</button>
        </div>
        <div class="tool-row">
          <button type="button" class="secondary" id="painter-load">📥 Load Current</button>
          <button type="button" class="primary" id="painter-save">💾 Save Texture</button>
        </div>
        <div class="field">
          <label>Import Image</label>
          <input type="file" id="painter-import" accept="image/png">
        </div>
      </div>
    </div>
  </div>

  <details>
    <summary>View schema (for LLM prompts)</summary>
    <pre id="schema-view" style="background:var(--status-bg);color:var(--status-text);padding:1rem;border-radius:12px;overflow:auto;max-height:240px;"></pre>
  </details>
</main>
<script>
const THEME_KEY = "builder_theme_preference";
const LLM_PROVIDER_KEY = "builder_llm_provider";
const LLM_API_KEY_STORAGE = "builder_llm_api_key";
const BUILD_MODE_KEY = "builder_build_mode";
const editor = document.getElementById("spec-editor");
const statusEl = document.getElementById("status");
const schemaView = document.getElementById("schema-view");
const resourceInput = document.getElementById("resource");
const behaviorInput = document.getElementById("behavior");
const llmPrompt = document.getElementById("llm-prompt");
const llmButton = document.getElementById("llm-run");
const llmProvider = document.getElementById("llm-provider");
const llmKey = document.getElementById("llm-key");
const themeToggle = document.getElementById("theme-toggle");
const buildModeSelect = document.getElementById("build-mode");
const buildBundleBtn = document.getElementById("build-bundle");
const sidebarStatusEl = document.getElementById("sidebar-status");
const mobListEl = document.getElementById("mob-list");
const addMobBtn = document.getElementById("add-mob");

// Painter Elements
const canvas = document.getElementById("pixel-canvas");
const ctx = canvas.getContext("2d", { willReadFrequently: true });
const painterColor = document.getElementById("painter-color");
const painterPencil = document.getElementById("painter-pencil");
const painterEraser = document.getElementById("painter-eraser");
const painterClear = document.getElementById("painter-clear");
const painterLoad = document.getElementById("painter-load");
const painterSave = document.getElementById("painter-save");
const painterImport = document.getElementById("painter-import");

let currentMobName = "current";
let isDrawing = false;
let currentTool = "pencil";
const GRID_SIZE = 64;
const SCALE = canvas.width / GRID_SIZE;

function applyTheme(theme) {
  document.body.classList.toggle("theme-dark", theme === "dark");
  if (themeToggle) {
    themeToggle.textContent = theme === "dark" ? "☀ Light Mode" : "🌙 Dark Mode";
  }
}

function initTheme() {
  const stored = localStorage.getItem(THEME_KEY);
  const theme = stored === "dark" ? "dark" : "light";
  applyTheme(theme);
}

function loadLlmPrefs() {
  const storedProvider = localStorage.getItem(LLM_PROVIDER_KEY);
  const storedKey = localStorage.getItem(LLM_API_KEY_STORAGE);
  if (storedProvider && llmProvider) {
    llmProvider.value = storedProvider;
  }
  if (storedKey && llmKey) {
    llmKey.value = storedKey;
  }
}

function loadBuildMode() {
  const storedMode = localStorage.getItem(BUILD_MODE_KEY);
  if (storedMode && buildModeSelect) {
    buildModeSelect.value = storedMode;
  }
}

function setStatus(message, isError=false) {
  statusEl.textContent = message;
  statusEl.style.color = isError ? "#fecdd3" : "#94a3b8";
}

async function loadMobList() {
  try {
    const res = await fetch("/api/mobs");
    const data = await res.json();
    mobListEl.innerHTML = "";
    data.mobs.forEach(name => {
      const li = document.createElement("li");
      li.className = "mob-item" + (name === currentMobName ? " active" : "");
      
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = true; // Default to selected
      cb.onclick = (e) => e.stopPropagation();
      li.appendChild(cb);
      
      const span = document.createElement("span");
      span.className = "mob-name";
      span.textContent = name;
      li.appendChild(span);
      
      const del = document.createElement("button");
      del.className = "delete-btn";
      del.textContent = "🗑";
      del.onclick = (e) => deleteMob(e, name);
      li.appendChild(del);
      
      li.onclick = () => selectMob(name);
      mobListEl.appendChild(li);
    });
    // If current mob is gone, pick another
    if (data.mobs.length > 0 && !data.mobs.includes(currentMobName)) {
      selectMob(data.mobs[0]);
    }
  } catch (err) {
    console.error("Failed to load mob list", err);
  }
}

async function selectMob(name) {
  currentMobName = name;
  setStatus(`Loading ${name}...`);
  const res = await fetch(`/api/mobs/${name}`);
  if (!res.ok) {
    setStatus(`Failed to load ${name}`, true);
    return;
  }
  const data = await res.json();
  editor.value = JSON.stringify(data.spec, null, 2);
  schemaView.textContent = JSON.stringify(data.schema || {}, null, 2);
  setStatus(`Loaded ${name} at ` + new Date().toLocaleTimeString());
  
  // Update UI active state
  document.querySelectorAll(".mob-item").forEach(el => {
    el.classList.toggle("active", el.querySelector(".mob-name").textContent === name);
  });

  // Load texture into painter automatically
  loadTextureIntoPainter(name);
}

// Painter Logic
function initPainter() {
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const draw = (e) => {
    if (!isDrawing) return;
    const rect = canvas.getBoundingClientRect();
    const x = Math.floor((e.clientX - rect.left) / (rect.width / GRID_SIZE));
    const y = Math.floor((e.clientY - rect.top) / (rect.height / GRID_SIZE));

    if (currentTool === "pencil") {
      ctx.fillStyle = painterColor.value;
      ctx.fillRect(x * SCALE, y * SCALE, SCALE, SCALE);
    } else {
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(x * SCALE, y * SCALE, SCALE, SCALE);
    }
  };

  canvas.addEventListener("mousedown", (e) => { isDrawing = true; draw(e); });
  canvas.addEventListener("mousemove", draw);
  window.addEventListener("mouseup", () => { isDrawing = false; });

  painterPencil.onclick = () => { currentTool = "pencil"; updateToolUI(); };
  painterEraser.onclick = () => { currentTool = "eraser"; updateToolUI(); };
  painterClear.onclick = () => {
    if (confirm("Clear canvas?")) {
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
  };

  painterLoad.onclick = () => loadTextureIntoPainter(currentMobName);
  
  painterSave.onclick = async () => {
    if (!currentMobName) return;
    setStatus(`Saving texture for ${currentMobName}...`);
    
    // Create a temporary 64x64 canvas to export the actual image
    const tempCanvas = document.createElement("canvas");
    tempCanvas.width = GRID_SIZE;
    tempCanvas.height = GRID_SIZE;
    const tempCtx = tempCanvas.getContext("2d");
    tempCtx.imageSmoothingEnabled = false;
    tempCtx.drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, GRID_SIZE, GRID_SIZE);
    
    const blob = await new Promise(resolve => tempCanvas.toBlob(resolve, "image/png"));
    const formData = new FormData();
    formData.append("file", blob, `${currentMobName}.png`);
    
    const res = await fetch(`/api/mobs/${currentMobName}/texture`, {
      method: "POST",
      body: formData
    });
    
    if (res.ok) {
      setStatus(`Texture saved for ${currentMobName}.`);
    } else {
      setStatus(`Failed to save texture.`, true);
    }
  };

  painterImport.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  };

  updateToolUI();
}

function updateToolUI() {
  painterPencil.classList.toggle("primary", currentTool === "pencil");
  painterPencil.classList.toggle("secondary", currentTool !== "pencil");
  painterEraser.classList.toggle("primary", currentTool === "eraser");
  painterEraser.classList.toggle("secondary", currentTool !== "eraser");
}

async function loadTextureIntoPainter(name) {
  if (!name) return;
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.onload = () => {
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  };
  // Add cache buster
  img.src = `/api/mobs/${name}/texture?t=` + new Date().getTime();
}

initPainter();

async function loadSpec() {
  await loadMobList();
  
  const mobs = Array.from(mobListEl.querySelectorAll(".mob-item .mob-name")).map(s => s.textContent);
  
  if (mobs.length === 0) {
    // If no mobs exist, trigger creation of 'current' by fetching default
    currentMobName = "current";
    setStatus("Initializing default mob...");
    const res = await fetch("/api/spec");
    const data = await res.json();
    editor.value = JSON.stringify(data.spec, null, 2);
    schemaView.textContent = JSON.stringify(data.schema || {}, null, 2);
    await loadMobList(); // Refresh list to show 'current'
  } else {
    // Select existing currentMobName or first in list
    if (mobs.includes(currentMobName)) {
      await selectMob(currentMobName);
    } else {
      await selectMob(mobs[0]);
    }
  }
}

async function saveSpec() {
  let spec;
  try {
    spec = JSON.parse(editor.value);
  } catch (err) {
    setStatus("JSON parse error: " + err.message, true);
    return null;
  }
  
  // If short_name changed, we treat it as a rename/move
  const targetName = spec.short_name || currentMobName;
  
  const res = await fetch(`/api/mobs/${targetName}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(spec)
  });
  
  const payload = await res.json().catch(() => ({}));
  if (!res.ok) {
    const detail = payload.detail || JSON.stringify(payload);
    setStatus("Save failed: " + detail, true);
    return null;
  }
  
  currentMobName = targetName;
  editor.value = JSON.stringify(payload.spec, null, 2);
  setStatus(`Saved ${currentMobName}.`);
  await loadMobList();
  return payload.spec;
}

async function deleteMob(event, name) {
  event.stopPropagation();
  if (!confirm(`Delete mob '${name}'?`)) return;
  
  const res = await fetch(`/api/mobs/${name}`, { method: "DELETE" });
  if (res.ok) {
    setStatus(`Deleted ${name}`);
    // If we deleted the active mob, reset currentMobName
    if (currentMobName === name) {
      currentMobName = ""; 
    }
    await loadMobList();
    if (!currentMobName) {
      const first = mobListEl.querySelector(".mob-item .mob-name");
      if (first) selectMob(first.textContent);
      else loadSpec();
    }
  } else {
    setStatus(`Failed to delete ${name}`, true);
  }
}

addMobBtn.addEventListener("click", async () => {
  const name = prompt("Enter a short name for the new mob (e.g. fire_cow):");
  if (!name) return;
  const safeName = name.toLowerCase().replace(/[^a-z0-9_]/g, "_");
  
  // Start with default spec
  const res = await fetch("/api/spec");
  const data = await res.json();
  const spec = data.spec;
  spec.short_name = safeName;
  spec.display_name = name.charAt(0).toUpperCase() + name.slice(1).replace(/_/g, " ");
  spec.identifier = `custom:${safeName}`;
  
  const saveRes = await fetch(`/api/mobs/${safeName}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(spec)
  });
  
  if (saveRes.ok) {
    currentMobName = safeName;
    await loadMobList();
    await selectMob(safeName);
  } else {
    const err = await saveRes.json();
    alert("Error creating mob: " + (err.detail || "Unknown error"));
  }
});

async function buildArtifact() {
  const selectedMobs = Array.from(mobListEl.querySelectorAll(".mob-item"))
    .filter(item => item.querySelector("input[type='checkbox']").checked)
    .map(item => item.querySelector(".mob-name").textContent);

  if (selectedMobs.length === 0) {
    setStatus("No mobs selected for bundle.", true);
    return;
  }

  const choice = buildModeSelect ? buildModeSelect.value : "bundle";
  const msg = `Building bundle with ${selectedMobs.length} mobs (${choice})...`;
  setStatus(msg);
  if (sidebarStatusEl) {
    sidebarStatusEl.textContent = msg;
    sidebarStatusEl.style.display = "block";
    sidebarStatusEl.style.color = "var(--muted)";
  }
  
  const formData = new FormData();
  if (resourceInput.files[0]) formData.append("resource", resourceInput.files[0]);
  if (behaviorInput.files[0]) formData.append("behavior", behaviorInput.files[0]);
  formData.append("build_mode", choice);
  formData.append("target_mobs", selectedMobs.join(","));

  const res = await fetch("/api/build", { method: "POST", body: formData });
  const payload = await res.json().catch(() => ({}));
  if (!res.ok) {
    const detail = payload.detail || payload.error || res.statusText;
    setStatus("Build failed: " + detail, true);
    if (sidebarStatusEl) {
      sidebarStatusEl.textContent = "Build failed: " + detail;
      sidebarStatusEl.style.color = "var(--danger)";
    }
    return;
  }
  const link = document.createElement("a");
  link.href = payload.artifact || payload.bundle_zip;
  link.textContent = payload.kind === "mcworld" ? "Download .mcworld" : "Download bundle";
  link.target = "_blank";
  link.rel = "noopener";
  link.style.color = "var(--primary)";
  link.style.fontWeight = "bold";

  const successMsg = `${payload.kind === "mcworld" ? "World" : "Bundle"} ready. `;
  statusEl.innerHTML = successMsg;
  statusEl.appendChild(link);

  if (sidebarStatusEl) {
    sidebarStatusEl.innerHTML = successMsg;
    sidebarStatusEl.appendChild(link.cloneNode(true));
    sidebarStatusEl.style.color = "var(--text)";
  }
}

async function requestLlm() {
  if (!llmPrompt) return;
  const instruction = llmPrompt.value.trim();
  if (!instruction) {
    setStatus("Enter instructions for the LLM assistant.", true);
    return;
  }
  const provider = llmProvider ? llmProvider.value : "openai";
  setStatus(`Contacting ${provider}...`);
  const apiKey = llmKey ? llmKey.value.trim() : "";
  const requestBody = { prompt: instruction, provider };
  if (apiKey) {
    requestBody.api_key = apiKey;
  }
  let res;
  try {
    res = await fetch("/api/spec/llm", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(requestBody)
    });
  } catch (err) {
    console.error("LLM fetch failed", err);
    setStatus("LLM request failed (network): " + err.message, true);
    return;
  }
  const payload = await res.json().catch(() => ({}));
  if (!res.ok) {
    const detail = payload.detail || payload.error || res.statusText;
    setStatus("LLM request failed: " + detail, true);
    return;
  }
  console.log("LLM response", payload);
  editor.value = JSON.stringify(payload.spec, null, 2);
  setStatus(`${provider} updated and saved the spec at ${new Date().toLocaleTimeString()}.`);
}

document.getElementById("reset").addEventListener("click", (e) => {
  e.preventDefault();
  loadSpec();
});
document.getElementById("save").addEventListener("click", (e) => {
  e.preventDefault();
  saveSpec();
});
buildBundleBtn.addEventListener("click", async (e) => {
  e.preventDefault();
  // Ensure current spec is saved before building
  if (currentMobName) {
    const saved = await saveSpec();
    if (saved === null) return; // Stop if current spec has errors
  }
  await buildArtifact();
});
llmButton?.addEventListener("click", async (e) => {
  e.preventDefault();
  await requestLlm();
});
themeToggle?.addEventListener("click", () => {
  const next = document.body.classList.contains("theme-dark") ? "light" : "dark";
  applyTheme(next);
  localStorage.setItem(THEME_KEY, next);
});
llmProvider?.addEventListener("change", () => {
  localStorage.setItem(LLM_PROVIDER_KEY, llmProvider.value);
});
llmKey?.addEventListener("input", () => {
  localStorage.setItem(LLM_API_KEY_STORAGE, llmKey.value.trim());
});
buildModeSelect?.addEventListener("change", () => {
  localStorage.setItem(BUILD_MODE_KEY, buildModeSelect.value);
});

initTheme();
loadLlmPrefs();
loadBuildMode();
loadSpec();
</script>
