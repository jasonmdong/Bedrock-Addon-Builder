# =============================================================================
# Docker Compose for MCT (Minecraft Creator Tools)
# =============================================================================
# Run from the extracted mctools package:
#   cd docker
#   docker-compose up -d
# =============================================================================

services:
  mct:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: mct:latest
    container_name: mct-server
    restart: unless-stopped

    environment:
      # REQUIRED: You must accept the Minecraft EULA
      # Read it at: https://minecraft.net/eula
      # Change to 'true' after reading and accepting the EULA
      - MCTOOLS_I_ACCEPT_EULA_AT_MINECRAFTDOTNETSLASHEULA=false

      # Security: Set a passcode for admin access (recommended: 8+ alphanumeric)
      - MCTOOLS_ADMIN_PASSCODE=

      # Server identity
      - MCTOOLS_TITLE=Minecraft Server
      - MCTOOLS_MOTD=A Minecraft Server

      # Server slot (0-79) - affects game port: 19132 + (slot × 32)
      - MCTOOLS_SLOT=0

    ports:
      # MCT Web UI
      - "6126:6126"
      # Minecraft game port (UDP)
      - "19132:19132/udp"
      - "19133:19133/udp"

    volumes:
      # Persistent data storage
      - mct-server:/data/server
      - mct-worlds:/data/worlds
      - mct-cli:/data/cli

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6126/"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  mct-server:
  mct-worlds:
  mct-cli:
